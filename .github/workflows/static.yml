# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages
on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["Main"]
  # Triggers on new release publication
  release:
    types: [published]
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages and repo writes
permissions:
  contents: write
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false
jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Release Tarball to releases/
        run: |
          # Determine tag: Use release tag if triggered by release, else 'v0.1.1' for manual/push runs
          TAG=${{ github.event_name == 'release' && github.event.release.tag_name || 'v0.1.1' }}
          echo "Using tag: $TAG"
          
          # Create releases/ directory
          mkdir -p releases
          
          # Download tar.gz directly to releases/ (no extraction)
          curl -L -o "releases/${TAG}.tar.gz" \
            "https://codeload.github.com/${{ github.repository }}/tar.gz/refs/tags/$TAG"

      - name: Ensure releases/ is in .gitignore
        run: |
          # Append releases/ to .gitignore if not already present
          if ! grep -q "^releases/" .gitignore 2>/dev/null; then
            echo "releases/" >> .gitignore
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add .gitignore
            git commit -m "Add releases/ to .gitignore" || true
            git push origin HEAD:${{ github.ref_name }} || true  # Push to branch (not tag); ignore failures
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload releases/ directory contents (serves .tar.gz statically)
          path: 'releases'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
